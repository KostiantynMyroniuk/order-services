name: order-services
on:
  push:
    branches: ["main"]
  pull-request:
    branches: ["main"]

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION_PATH: "order-services.slnx"
  PUBLISH_DIR: "./publish"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore

      - name: Test 
        run: dotnet test ${{ env.SOLUTION_PATH }} --no-restore --no-build
      
      - name: Publish
        run: dotnet publish ${{ env.SOLUTION_PATH }} -c Release --no-restore --no-build -o ${{ env.PUBLISH_DIR }}
        