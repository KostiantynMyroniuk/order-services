services:
  catalog.api:
    build:
      context: .
      dockerfile: src/Catalog.API/Dockerfile
    ports:
      - "5001:8080"
    environment:
      ConnectionStrings__CatalogDb: "Server=sqlserver,1433;Database=CatalogDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    depends_on:
      sqlserver:
        condition: service_healthy

  basket.api:
    build:
      context: .
      dockerfile: src/Basket.API/Dockerfile
    ports:
      - "5002:8080"
    environment:
      ConnectionStrings__Cache: "redis:6379"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      GrpcSettings__CatalogApi: ${CATALOG_API_URL}
    depends_on:
      redis:
        condition: service_healthy
      catalog.api:
        condition: service_started

  identity.api:
    build:
      context: .
      dockerfile: src/Identity.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__IdentityDb: "Server=sqlserver,1433;Database=IdentityDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: ${JwtSigningKey}
    depends_on:
      sqlserver:
        condition: service_healthy

  orders.api:
    build:
      context: .
      dockerfile: src/Orders.API/Dockerfile
    ports:
      - "5003:8080"
    environment:
      ConnectionStrings__OrdersDb: "Server=sqlserver,1433;Database=OrdersDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      GrpcSettings__CatalogApi: ${CATALOG_API_URL}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog.api:
        condition: service_started

  notification.worker:
    build:
      context: .
      dockerfile: src/Notification.Worker/Dockerfile
    environment:
      ConnectionStrings__RabbitMq: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672"
      EmailConfig__SmtpServer: ${SMTP_SERVER}
      EmailConfig__SmtpPort: ${SMTP_PORT}
      EmailConfig__FromEmail: ${FROM_EMAIL}
      EmailConfig__AppPassword: ${APP_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -No -b -o /dev/null"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq